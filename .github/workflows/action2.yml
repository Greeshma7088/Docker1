name: Build Docker2 Image

on:
  push:
    branches:
      - docker2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker2 image
        run: docker build -t docker2-image:latest .

      - name: Run Docker2 container and output logs
        run: docker run --rm docker2-image:latest
