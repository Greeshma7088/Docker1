name: Build and Test Docker2 Image

on:
  push:
    branches:
      - docker2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t docker2-image:latest .

      - name: Run Docker container in background
        run: docker run -d --name docker2-container -p 3000:3000 docker2-image:latest

      - name: Wait for server to be ready
        run: sleep 5

      - name: Test response from app
        run: curl http://localhost:3000

      - name: Show container logs
        run: docker logs docker2-container

      - name: Stop container
        run: docker stop docker2-container
        
      - name: Login to DockerHub (optional)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

